[package]
name = "ze_tree_bevy"
version = "0.1.0"
description = "Bevy plugin for ze_tree procedural trees: meshes, materials, wind and LOD"
edition.workspace = true

[dependencies]
ze_tree = { path = "../ze_tree" }
serde_json = { workspace = true }
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_pbr",
    "bevy_mikktspace",
    "ktx2",
    "zstd_rust",
] }

[features]
# Enable wind animation and camera-facing billboards for exported ze_tree glTF scenes.
# Requires add_tree_gltf_attributes and ZeTreePlugin in the app.
gltf = ["bevy/bevy_gltf"]

[dev-dependencies]
ze_tree = { path = "../ze_tree", features = ["export-gltf"] }
bevy = { version = "0.20.1", features = ["free_camera"] }

[[example]]
name = "gltf_tree"
required-features = ["gltf"]

[package.metadata.docs.rs]
all-features = true
